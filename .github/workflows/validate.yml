# Cloudflare Pages builds and deploys this site from the repository itself, so this
# workflow does not deploy anything. It exists to fail loudly, in GitHub, when the data
# or the prose breaks. Without it a bad fact would surface only as a red build in
# somebody else's dashboard, which is the wrong place to find out.
name: Validate and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validation runs on its own so a data or prose failure reads as a data or
      # prose failure in the log, not as a build error. It is also run again inside
      # npm run build, which is the gate that matters.
      - run: npm run validate
      - run: npm run build
